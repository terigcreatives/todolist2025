<form method="POST">
  {% csrf_token %}
  <input type="text" name="title" value="{{ task.title }}" required>
  <textarea name="description">{{ task.description }}</textarea>
  <select name="priority">
    <option value="L" {% if task.priority == "L" %}selected{% endif %}>Low</option>
    <option value="M" {% if task.priority == "M" %}selected{% endif %}>Medium</option>
    <option value="H" {% if task.priority == "H" %}selected{% endif %}>High</option>
  </select>
  <input type="date" name="due_date" value="{{ initial_date }}">
  <input type="time" name="due_time" value="{{ initial_time }}">
  <button type="submit">Save</button>
</form>

<ul>
  {% for subtask in task.subtasks.all %}
    <li>
      <input type="checkbox" {% if subtask.completed %}checked{% endif %} disabled>
      {{ subtask.title }}
    </li>
  {% endfor %}
</ul>
