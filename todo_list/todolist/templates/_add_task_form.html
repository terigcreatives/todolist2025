<!-- Modal Backdrop -->
<div id="taskModal" class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center hidden z-50">
  <div class="bg-white p-0 rounded shadow-lg w-full max-w-md relative flex flex-col" style="max-height: 90vh;">
    <button onclick="closeAddTaskModal()" class="absolute top-2 right-2 text-gray-400 hover:text-red-600 text-xl z-20">&times;</button>
    <h2 id="modalTitle" class="text-xl font-bold mb-4 px-6 pt-6">Add New Task</h2>
    <form id="taskForm" method="POST" action="{% url 'add_task' %}" class="flex flex-col flex-1">
      <input type="hidden" name="next" id="nextUrl" value="{{ request.get_full_path }}">
      {% csrf_token %}
      <input type="hidden" name="task_id" id="editTaskId">
      <!-- Scrollable content -->
      <div class="flex-1 overflow-y-auto px-6" style="max-height: 60vh;">
        <div class="mb-3">
          <label class="block mb-1 font-medium">Title</label>
          <input type="text" name="title" class="w-full border rounded px-3 py-2" required>
        </div>
        <div class="mb-3">
          <label class="block mb-1 font-medium">Description</label>
          <textarea name="description" class="w-full border rounded px-3 py-2"></textarea>
        </div>
        <div class="mb-3">
          <label class="block mb-1 font-medium">Priority</label>
          <select name="priority" class="w-full border rounded px-3 py-2">
            <option value="L">Low</option>
            <option value="M">Medium</option>
            <option value="H">High</option>
          </select>
        </div>
        <div class="mb-3 flex space-x-2">
          <div class="flex-1">
            <label class="block mb-1 font-medium">Due Date</label>
            <input type="date" name="due_date" id="taskDate" class="w-full border rounded px-3 py-2">
          </div>
          <div class="flex-1">
            <label class="block mb-1 font-medium">Due Time</label>
            <input type="time" name="due_time" id="taskTime" class="w-full border rounded px-3 py-2">
          </div>
        </div>
        <div class="mb-3">
          <label class="block mb-1 font-medium">Subtasks</label>
          <div id="subtasksList"></div>
          <button type="button" onclick="addSubtaskField()" class="mt-2 px-2 py-1 bg-blue-100 text-blue-700 rounded">+ Add Subtask</button>
        </div>
      </div>
      <!-- Fixed buttons at the bottom -->
      <div class="flex justify-end gap-2 px-6 py-4 bg-white border-t sticky bottom-0 left-0 right-0 z-10">
        <button type="button" onclick="closeAddTaskModal()" class="px-4 py-2 rounded bg-gray-200 hover:bg-gray-300">Cancel</button>
        <button type="submit" class="px-4 py-2 rounded bg-blue-600 text-white hover:bg-blue-700">Save</button>
      </div>
    </form>
  </div>
</div>

<script>
// Modal functions
function openAddTaskModal() {
    document.getElementById('modalTitle').textContent = 'Add New Task';
    document.getElementById('taskForm').reset();
    // Set today's date as default
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('taskDate').value = today;
    document.getElementById('taskModal').classList.remove('hidden');
    // Set 'next' value to current URL on open
    document.getElementById('nextUrl').value = window.location.pathname + window.location.search;
}
function closeAddTaskModal() {
    document.getElementById('taskModal').classList.add('hidden');
}

let subtaskCounter = 0;

// For new subtasks
function addSubtaskField(title = '', completed = false) {
    subtaskCounter++;
    const subtasksList = document.getElementById('subtasksList');
    const div = document.createElement('div');
    div.className = 'flex items-center mb-2 subtask-row';
    div.innerHTML = `
        <input type="text" name="subtask_title_new_${subtaskCounter}" value="${title}" placeholder="Subtask" class="w-2/3 border rounded px-2 py-1 mr-2">
        <label class="mr-2">
            <input type="checkbox" name="subtask_completed_new_${subtaskCounter}" ${completed ? 'checked' : ''}> Done
        </label>
        <button type="button" onclick="this.parentElement.remove()" class="text-red-500 ml-2"><i class="fi fi-rr-trash"></i></button>
    `;
    subtasksList.appendChild(div);
}

// For existing subtasks (when editing)
function addExistingSubtaskField(id, title, completed) {
    const subtasksList = document.getElementById('subtasksList');
    const idx = id;
    const div = document.createElement('div');
    div.className = 'flex items-center mb-2 subtask-row';
    div.innerHTML = `
        <input type="hidden" name="subtask_id_${idx}" value="${id}">
        <input type="text" name="subtask_title_${idx}" value="${title}" class="w-2/3 border rounded px-2 py-1 mr-2">
        <label class="mr-2">
            <input type="checkbox" name="subtask_completed_${idx}" ${completed ? 'checked' : ''}> Done
        </label>
        <label class="mr-2">
            <input type="checkbox" name="subtask_delete_${idx}"> Delete
        </label>
        <button type="button" onclick="this.parentElement.remove()" class="text-red-500 ml-2">🗑️</button>
    `;
    subtasksList.appendChild(div);
}

// When opening the modal for editing
function openEditTaskModal(id, title, description, priority, dueDate, dueTime, subtasks) {
    document.getElementById('modalTitle').textContent = 'Edit Task';
    document.getElementById('taskForm').action = `/editTask/${id}/`;
    document.getElementById('editTaskId').value = id;
    document.getElementById('taskForm').reset();
    document.querySelector('input[name="title"]').value = title;
    document.querySelector('textarea[name="description"]').value = description;
    document.querySelector('select[name="priority"]').value = priority;
    document.getElementById('taskDate').value = dueDate;
    document.getElementById('taskTime').value = dueTime;
    // Set 'next' value to current URL on open
    document.getElementById('nextUrl').value = window.location.pathname + window.location.search;

    // Clear and add subtasks
    document.getElementById('subtasksList').innerHTML = '';
    subtaskCounter = 0;
    if (subtasks && subtasks.length) {
        subtasks.forEach(function(subtask) {
            addExistingSubtaskField(subtask.id, subtask.title, subtask.completed);
        });
    }
    document.getElementById('taskModal').classList.remove('hidden');
}

// Optional: Reset subtasks when opening modal
function openAddTaskModal() {
    document.getElementById('modalTitle').textContent = 'Add New Task';
    document.getElementById('taskForm').reset();
    document.getElementById('subtasksList').innerHTML = '';
    subtaskCounter = 0;
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('taskDate').value = today;
    document.getElementById('taskModal').classList.remove('hidden');
}

function openEditTaskModal(id, title, description, priority, dueDate, dueTime, subtasks) {
    document.getElementById('modalTitle').textContent = 'Edit Task';
    document.getElementById('taskForm').action = `/editTask/${id}`; 
    
    // Update form action
    document.getElementById('editTaskId').value = id;
    document.getElementById('taskForm').reset();

    document.querySelector('input[name="title"]').value = title;
    document.querySelector('textarea[name="description"]').value = description;
    document.querySelector('select[name="priority"]').value = priority;
    document.getElementById('taskDate').value = dueDate;
    document.getElementById('taskTime').value = dueTime;

    // Subtasks
    document.getElementById('subtasksList').innerHTML = '';
    subtaskCounter = 0;
    if (subtasks && subtasks.length) {
        subtasks.forEach(function(subtaskTitle) {
            subtaskCounter++;
            const input = document.createElement('input');
            input.type = 'text';
            input.name = `subtask_${subtaskCounter}`;
            input.className = 'w-full border rounded px-3 py-2 mb-2';
            input.placeholder = `Subtask ${subtaskCounter}`;
            input.value = subtaskTitle;
            document.getElementById('subtasksList').appendChild(input);
        });
    }

    document.getElementById('taskModal').classList.remove('hidden');
}

function handleEditClick(btn) {
    const id = btn.getAttribute('data-task-id');
    const title = btn.getAttribute('data-title');
    const description = btn.getAttribute('data-description');
    const priority = btn.getAttribute('data-priority');
    const dueDate = btn.getAttribute('data-due-date');
    const dueTime = btn.getAttribute('data-due-time');
    // For the simple version:
    const subtasksRaw = btn.getAttribute('data-subtasks');
    const subtasks = subtasksRaw ? subtasksRaw.split('||') : [];

    openEditTaskModal(id, title, description, priority, dueDate, dueTime, subtasks);
}
</script>
