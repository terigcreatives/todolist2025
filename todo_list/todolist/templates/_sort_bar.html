<!-- _sort_bar.html -->
<div class="flex items-center justify-end mb-4">
  <span class="text-sm text-gray-500 mr-2">Sort by:</span>
  <form method="get" id="sortForm">
    <select name="sort" id="sort-all"
      onchange="document.getElementById('sortForm').submit()"
      class="text-sm border border-gray-300 rounded-lg px-3 py-1 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white">
      <option value="created" {% if request.GET.sort == "created" or not request.GET.sort %}selected{% endif %}>Date Created</option>
      <option value="title" {% if request.GET.sort == "title" %}selected{% endif %}>Title (A-Z)</option>
      <option value="priority" {% if request.GET.sort == "priority" %}selected{% endif %}>Priority</option>
      <option value="due_date" {% if request.GET.sort == "due_date" %}selected{% endif %}>Due Date</option>
    </select>
  </form>
</div>
